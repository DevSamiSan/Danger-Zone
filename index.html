<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nosifer&family=Share+Tech+Mono&display=swap');
        
        :root { --r: #ff0000; --dr: #300; --bg: #000; --g: #00ff41; --w: #fff; }

        * { cursor: none; box-sizing: border-box; }

        body, html {
            background-color: var(--bg); color: var(--r);
            font-family: 'Share Tech Mono', monospace;
            height: 100vh; margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; 
        }

        /* CRT Scanline Overlay */
        body::after {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 1000; background-size: 100% 3px, 3px 100%; pointer-events: none;
        }

        /* Custom Crosshair Cursor */
        #cursor {
            position: fixed; width: 20px; height: 20px; border: 1px solid var(--r);
            border-radius: 50%; pointer-events: none; z-index: 10001;
            transform: translate(-50%, -50%); transition: width 0.2s, height 0.2s;
        }
        #cursor::after { content: ""; position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: var(--w); border-radius: 50%; transform: translate(-50%, -50%); }

        /* Demon Eyes - Professional Horror */
        .eyes-box { position: absolute; top: 10%; display: flex; gap: 100px; z-index: 1; filter: drop-shadow(0 0 10px var(--r)); }
        .eye {
            width: 80px; height: 45px; background: radial-gradient(circle, #200, #000);
            border: 2px solid #200; border-radius: 50%; position: relative; overflow: hidden;
        }
        .pupil {
            width: 18px; height: 18px; background: var(--r); border-radius: 50%;
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            box-shadow: 0 0 20px var(--r), inset 0 0 5px #000;
        }

        /* Adaptive Container */
        .container {
            background: rgba(5, 0, 0, 0.98); border: 1px solid var(--dr);
            padding: 30px; position: relative; z-index: 100;
            box-shadow: 0 0 150px rgba(0,0,0,1), 0 0 20px rgba(255,0,0,0.05);
            display: flex; flex-direction: column; transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* PC View: Horizontal */
        @media (min-width: 900px) {
            .container { width: 900px; height: 550px; flex-direction: row; border-radius: 5px; }
            .side-bar { width: 250px; border-left: 1px solid #100; padding-left: 20px; display: flex; flex-direction: column; justify-content: space-between; text-align: left; }
            .main-content { flex: 1; padding-right: 20px; display: flex; flex-direction: column; justify-content: space-between; }
        }

        /* Mobile View: Vertical */
        @media (max-width: 899px) {
            .container { width: 95%; height: 90vh; border-radius: 15px; }
            .eyes-box { gap: 40px; top: 5%; }
            .eye { width: 50px; height: 30px; }
            .side-bar { order: 2; border-top: 1px solid #100; padding-top: 10px; margin-top: 10px; font-size: 10px; }
            .main-content { order: 1; flex: 1; display: flex; flex-direction: column; }
        }

        /* High Visibility Textareas */
        textarea {
            width: 100%; height: 140px; background: #080808; border: 1px solid #200;
            color: var(--g); padding: 15px; font-size: 15px; font-family: inherit;
            resize: none; outline: none; transition: 0.3s;
        }
        textarea:focus { border-color: var(--r); background: #111; box-shadow: 0 0 15px rgba(255,0,0,0.1); }

        .btn-row { display: flex; gap: 15px; margin: 15px 0; }
        button {
            flex: 1; padding: 18px; background: transparent; color: var(--r);
            border: 1px solid var(--r); font-family: inherit; font-weight: bold;
            text-transform: uppercase; letter-spacing: 2px; transition: 0.3s;
        }
        button:hover { background: var(--r); color: #000; box-shadow: 0 0 30px var(--r); }

        .copy-btn { background: #151515; color: #fff; border: 1px solid #333; width: 100%; margin-top: 10px; font-size: 10px; }
        .copy-btn:hover { border-color: var(--w); color: var(--w); }

        #boot-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 10000; display: flex; justify-content: center; align-items: center;
        }

        #log-stream { font-size: 9px; color: #333; height: 80px; overflow: hidden; font-style: italic; }
    </style>
</head>

function genUID() {

function mMove(e) {
    const cur = document.getElementById('cursor');
    cur.style.left = e.clientX + "px"; cur.style.top = e.clientY + "px";

    const pupils = document.querySelectorAll('.pupil');
    pupils.forEach(p => {
        const rect = p.parentElement.getBoundingClientRect();
        const ex = rect.left + rect.width / 2;
        const ey = rect.top + rect.height / 2;
        const angle = Math.atan2(e.clientY - ey, e.clientX - ex);
        const dist = 12;
        p.style.transform = `translate(calc(-50% + ${Math.cos(angle) * dist}px), calc(-50% + ${Math.sin(angle) * dist}px))`;
    });

    const term = document.getElementById('terminal');
    let x = (e.clientX - window.innerWidth/2) / 70;
    let y = (e.clientY - window.innerHeight/2) / 70;
    term.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;
}

function op(isE) {

}
