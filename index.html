<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nosifer&family=Share+Tech+Mono&display=swap');
        
        :root { --red: #8b0000; --bright-red: #ff0000; --dark: #020000; --green: #00ff41; }

        * { cursor: none; } /* إخفاء الماوس العادي */

        body, html {
            background-color: var(--dark); color: var(--red);
            font-family: 'Share Tech Mono', monospace;
            height: 100vh; margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; 
        }

        /* Custom Ghost Cursor */
        #custom-cursor {
            position: fixed; width: 15px; height: 15px; background: var(--bright-red);
            border-radius: 50%; pointer-events: none; z-index: 10001;
            box-shadow: 0 0 15px var(--bright-red); transition: transform 0.1s;
        }

        /* Shadow Eyes */
        .eyes-container {
            position: absolute; top: 15%; display: flex; gap: 80px; pointer-events: none;
        }
        .eye {
            width: 50px; height: 30px; background: #111; border-radius: 50%;
            position: relative; overflow: hidden; box-shadow: 0 0 20px #000 inset;
            border: 1px solid #222; opacity: 0.6;
        }
        .pupil {
            width: 12px; height: 12px; background: #400; border-radius: 50%;
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            box-shadow: 0 0 10px var(--bright-red);
        }

        /* Main Responsive Container */
        .main-container {
            width: 90%; max-width: 650px; background: rgba(0,0,0,0.98);
            border: 1px solid #300; padding: 30px; position: relative;
            box-shadow: 0 0 100px rgba(0,0,0,1); z-index: 100;
            text-align: center; border-radius: 4px;
        }

        #consent-gate {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: black; z-index: 10000; display: flex; 
            justify-content: center; align-items: center; text-align: center;
        }

        .warning-box { border: 1px solid var(--red); padding: 40px; background: #050000; max-width: 500px; }
        .warning-box h1 { font-family: 'Nosifer', cursive; font-size: 20px; color: var(--red); }

        textarea {
            width: 100%; height: 120px; background: #000; border: 1px solid #111;
            color: var(--green); padding: 15px; font-size: 14px; font-family: inherit;
            resize: none; outline: none; margin: 10px 0; border-radius: 2px;
        }
        textarea:focus { border-color: var(--red); }

        .btn-box { display: flex; gap: 10px; margin: 10px 0; }
        button {
            flex: 1; padding: 15px; background: transparent; color: var(--red);
            border: 1px solid var(--red); font-family: inherit; font-weight: bold;
            transition: 0.3s; text-transform: uppercase; font-size: 12px;
        }
        button:hover { background: var(--red); color: #000; box-shadow: 0 0 20px var(--red); }

        #fake-log { font-size: 9px; color: #333; height: 50px; overflow: hidden; text-align: left; margin-top: 10px; }

        /* Flicker Effect */
        .flicker { animation: flick 0.1s infinite; }
        @keyframes flick { 0% { opacity: 0.95; } 50% { opacity: 1; } 100% { opacity: 0.98; } }

        /* Media Query for Mobile */
        @media (max-width: 600px) {
            .main-container { padding: 20px; }
            .eyes-container { top: 5%; gap: 40px; }
            .eye { width: 35px; height: 20px; }
            h2 { font-size: 14px; }
        }
    </style>
</head>

function generateUID() {

    let renderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);

function updateVisuals(e) {
    // Custom Cursor
    const cursor = document.getElementById('custom-cursor');
    cursor.style.left = e.clientX + "px";
    cursor.style.top = e.clientY + "px";

    // Eye Tracking
    const pupils = document.querySelectorAll('.pupil');
    pupils.forEach(p => {
        let x = (e.clientX / window.innerWidth) * 20 - 10;
        let y = (e.clientY / window.innerHeight) * 10 - 5;
        p.style.transform = `translate(${x}px, ${y}px)`;
    });

    // Terminal Parallax
    const term = document.getElementById('terminal');
    let rx = (e.clientX - window.innerWidth/2) / 60;
    let ry = (e.clientY - window.innerHeight/2) / 60;
    term.style.transform = `rotateY(${rx}deg) rotateX(${-ry}deg)`;
}

function process(isEnc) {
    const i = document.getElementById('input').value;

            let inner = clean.substring(3, clean.length - 3);
